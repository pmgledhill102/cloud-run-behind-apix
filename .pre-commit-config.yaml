repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Two things here are not hand-written and must not be reformatted:
      # docs/diagrams/*.svg is the sole output of the drawio-export workflow, so
      # a local rewrite would be overwritten on the next merge; and
      # docs/repro/evidence/ holds raw captured transcripts, whose whitespace is
      # part of the evidence.
      - id: trailing-whitespace
        exclude: ^docs/(diagrams/.*\.svg|repro/evidence/)
      - id: end-of-file-fixer
        exclude: ^docs/(diagrams/.*\.svg|repro/evidence/)
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # `gitleaks git` takes no file arguments, so pre-commit's appended
      # filenames would fail every run.
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.0
    hooks:
      - id: cspell
        types_or: [markdown, plain-text, yaml]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  # shellcheck at --severity=warning, matching the rest of the estate. Dialects
  # come from each script's shebang, which is what keeps the POSIX scripts
  # checked as POSIX: do not set `shell=` in .shellcheckrc, because it overrides
  # the shebang and silently turns that check off.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # Formatting, kept separate from the linting above. Settings live in
  # .editorconfig, which shfmt reads natively, so the command line and this hook
  # agree without repeating the flags.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt

  # hadolint runs as a system tool: `id: hadolint` uses the binary on PATH, where
  # `hadolint-docker` would abort the whole pre-commit run on a machine with no
  # Docker daemon. Install it with `brew install hadolint`.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  # semgrep runs as a system tool: the upstream hook builds a venv inside a
  # clone of the whole semgrep repository. `args` replaces the upstream
  # defaults, and --error is what makes findings fail the hook at all.
  # pass_filenames: false keeps the hook and CI scanning the same thing, since
  # explicit paths bypass semgrep's default excludes.
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: semgrep
        language: system
        # last-user-is-root is excluded on purpose: hadolint (DL3002) and trivy
        # (DS-0002) check the same property, and both take a scoped exemption for
        # the mock gateway that binds :443 as root. Semgrep's inline marker cannot
        # sit beside hadolint's pragma, since each only works on the line directly
        # above the instruction, so the duplicate rule is the one dropped.
        args: ['--config', 'auto', '--error', '--exclude-rule', 'dockerfile.security.last-user-is-root.last-user-is-root']
        pass_filenames: false

  # All three hooks come from the one binary, so the hook and CI lint with the
  # same version (pinned in .github/workflows/go.yml too: keep them in step).
  # golangci-lint-fmt runs the formatters: block (gofmt, goimports).
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint
      - id: golangci-lint-fmt
