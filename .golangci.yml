# golangci-lint v2 schema. The v1 layout (top-level linters-settings) is
# rejected outright by v2.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pmgledhill102/cloud-run-behind-apix

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
